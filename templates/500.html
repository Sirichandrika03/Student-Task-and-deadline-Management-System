{% extends "base.html" %}

{% block title %}500 - System Error{% endblock %}

{% block content %}
<div class="error-container">
    <div class="error-card">
        <div class="error-code">500</div>
        <h2>Internal Server Error</h2>
        <p>An unexpected error occurred during operation execution.</p>
        <a href="{{ url_for('dashboard') }}" class="btn btn-primary mt-3">
            <i class="fa-solid fa-house"></i> Return to Dashboard
        </a>
    </div>
</div>
{% endblock %}
